<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3B6948">
<title>Trả dần mỗi ngày</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23C8452C'/%3E%3Ctext x='16' y='23' font-size='19' text-anchor='middle' fill='white' font-family='serif'%3E返%3C/text%3E%3C/svg%3E">
<style>:root{--serif:"Noto Serif",Georgia,serif;--sans:system-ui,Roboto,sans-serif;--mono:ui-monospace,"Roboto Mono",monospace;
--ac:#3B7A4D;--ac2:#C6613A;--acl:#9CC3A6;--acs:#EEF4EE;--ink:#1E2733;--mut:#6B7480;--card:#fff;--bg:#F4F1EA;--line:#E8E3D8;--soft:#F1EDE4;--bad:#B5482F;--badl:#F6DDD5;--hdink:#1E2733}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{background:var(--bg);font:15px/1.4 var(--sans);color:var(--ink);min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink)}
.hidden{display:none!important}
.mono{font-family:var(--mono)}
/* header */
.hd{position:relative;height:236px;overflow:hidden;background:#C9DFCB}
.hd img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.hd .t{position:absolute;left:16px;top:max(18px,env(safe-area-inset-top));right:12px;display:flex;align-items:center;gap:10px;color:var(--hdink)}
.hd.dark .t{--hdink:#fff;text-shadow:0 1px 3px #0006}
.stamp{width:34px;height:34px;border-radius:7px;background:#C8452C;color:#fff;display:grid;place-items:center;font:700 19px var(--serif);flex:none;text-shadow:none}
.ttl{font:600 18px var(--serif);white-space:nowrap}
.sub{font-size:12px;opacity:.85;white-space:nowrap}
.sp{flex:1;min-width:0}
.sdot{width:10px;height:10px;border-radius:50%;background:#9AA3AD;box-shadow:0 0 0 3px #ffffff90;flex:none}
.sdot.s-ok{background:#3BA55C}.sdot.s-busy{background:#E59A2E}.sdot.s-offline{background:#9AA3AD}.sdot.s-err{background:#D2463A}
.gear{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#ffffffa8;flex:none}
.hd.dark .gear{background:#ffffff26}
.gear svg{width:20px;height:20px;stroke:var(--hdink);fill:none;stroke-width:1.8}
.sbtn{display:flex;align-items:center;gap:8px;padding:6px}
/* layout */
.wrap{max-width:560px;margin:-64px auto 0;padding:0 12px 110px;position:relative}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px #0000000f}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:600}
.big{font:600 30px var(--serif);margin-top:4px;letter-spacing:-.01em}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:8px;font-size:13px}
.row b{font-family:var(--mono);font-weight:600;white-space:nowrap}
.muted{color:var(--mut)}.sm{font-size:12px;color:var(--mut)}
.bar{height:8px;border-radius:5px;background:var(--soft);overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:var(--ac);border-radius:5px}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--ac);color:#fff;border-radius:14px;font-weight:600;font-size:16px;min-height:52px;padding:0 16px;width:100%}
.btn.g{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.d{background:#fff;color:var(--bad);border:1px solid #EBC9BF}
.btn.s{min-height:42px;font-size:14px;border-radius:12px}
.btn:disabled{opacity:.5}
.btns{display:flex;gap:8px;margin-top:12px}
.link{color:var(--ac);font-weight:600;font-size:14px;padding:8px 4px}
.chip{font-size:11px;padding:2px 8px;border-radius:9px;white-space:nowrap;font-weight:600}
.c-pending{background:#FBEBD9;color:#A35A1E}.c-ok{background:var(--acs);color:var(--ac)}.c-rejected{background:var(--badl);color:var(--bad)}.c-miss{background:var(--soft);color:var(--mut)}.c-adv{background:#F3ECDD;color:#8A6420}
/* streak */
.streak{display:flex;align-items:center;gap:14px}
.fl{font:600 40px/1 var(--serif);color:var(--ac2);white-space:nowrap}
.msg{font-weight:600}
/* pending list */
.item{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .t{flex:1;min-width:0}
.item .t .s{font-size:12px;color:var(--mut);overflow-wrap:anywhere}
.item .amt{font-family:var(--mono);font-weight:600;white-space:nowrap}
.rb{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:17px;flex:none}
.rb.ok{background:var(--ac);color:#fff}.rb.no{background:var(--badl);color:var(--bad)}
.list{margin-top:6px}
.tapr{width:100%;text-align:left}
/* segmented */
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{font-size:12px;padding:5px 11px;border-radius:11px;background:var(--soft);color:var(--mut)}.seg button.on{background:var(--ac);color:#fff}
/* chart */
.chart{margin-top:10px}
.chart svg{display:block;width:100%;height:auto}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--mut);margin-top:8px}.leg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.stats3 b{display:block;font:600 19px var(--serif)}.stats3 span{font-size:11px;color:var(--mut)}
/* calendar */
.calh{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.calh b{font:600 16px var(--serif)}
.nav{display:flex;gap:4px}.nav button{width:36px;height:32px;border-radius:9px;background:var(--soft);font-size:16px;color:var(--mut)}
.nav button:disabled{opacity:.35}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}
.cal>*{aspect-ratio:1;border-radius:9px;display:grid;place-items:center;font-size:12px;position:relative}
.cal .w{font-weight:600;color:var(--mut);font-size:11px;aspect-ratio:auto;padding:2px 0}
.cal .d{background:var(--soft);color:var(--mut)}
.cal .pre{background:transparent;color:#C3BFB6}
.cal .full{background:var(--ac);color:#fff}
.cal .part{background:var(--acl);color:#fff}
.cal .pend{background:var(--acs);color:var(--ac);outline:1.5px dashed var(--acl);outline-offset:-2px}
.cal .miss{background:var(--badl);color:var(--bad)}
.cal .td{box-shadow:0 0 0 2px var(--ac2)}
.cal .nt::after{content:"";position:absolute;right:4px;top:4px;width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.7}
/* badges */
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.badge{font-size:13px;padding:6px 11px;border-radius:12px;background:var(--acs);color:var(--ac);font-weight:600}
.badge.off{background:var(--soft);color:#A9A49A;font-weight:500}
.hint{font-size:12px;color:var(--mut);margin-top:10px}
/* fab + sheets */
.fab{position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-size:32px;font-weight:300;box-shadow:0 4px 12px #0003;z-index:5}
.scrim{position:fixed;inset:0;background:#1E273366;z-index:20;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;z-index:21;padding:8px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .22s ease-out;max-width:560px;margin:0 auto;overscroll-behavior:contain}
.sheet.on{transform:none}
.lite .scrim,.lite .sheet{transition:none}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 12px}
.sheet h3{font:600 19px var(--serif);margin-bottom:10px}
.fld{margin-top:12px}
.fld label{display:block;font-size:12px;color:var(--mut);margin-bottom:5px;font-weight:600}
.in{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:#FBFAF7;font-size:16px;outline:none}
.in:focus{border-color:var(--ac);background:#fff}
.in.amt{font:600 22px var(--mono)}
textarea.in{min-height:70px;resize:vertical}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chips button{padding:7px 12px;border-radius:12px;background:var(--soft);font-size:13px;font-weight:600;color:var(--mut)}
.chips button.on{background:var(--ac);color:#fff}
.err{color:var(--bad);font-size:13px;margin-top:8px;min-height:1px}
.sec{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.sec:first-of-type{border-top:0;margin-top:4px;padding-top:0}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;font-size:14px}
.sw{width:46px;height:28px;border-radius:14px;background:#D9D4C9;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.sw.on{background:var(--ac)}.sw.on::after{transform:translateX(18px)}
.tsel{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.tsel button{padding:8px 2px;border-radius:10px;background:var(--soft);font-size:12px;font-weight:600;color:var(--mut)}
.tsel button.on{background:var(--ac);color:#fff}
.banner{background:#FBEBD9;color:#7A4313;border-radius:14px;padding:12px 14px;font-size:13px;margin-bottom:12px}
.banner.red{background:var(--badl);color:var(--bad)}
.welcome{padding:22px 4px}
.welcome p{margin-top:8px;color:var(--mut);font-size:14px}
pre.diag{font:11px/1.4 var(--mono);background:var(--soft);border-radius:10px;padding:10px;max-height:160px;overflow:auto;white-space:pre-wrap;word-break:break-all;margin-top:8px}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;opacity:0;pointer-events:none;z-index:40;max-width:86vw;text-align:center;transition:opacity .2s,transform .2s}
#toast.on{opacity:1;transform:translateX(-50%)}
.empty{color:var(--mut);font-size:13px;text-align:center;padding:14px 0}
.celebrate{background:var(--acs);border-radius:14px;padding:10px 12px;margin-top:12px;font-size:13px;color:var(--ac);font-weight:600}
</style>
</head>
<body>
<header class="hd" id="hd"><img id="scene" alt="">
  <div class="t"><div class="stamp">返</div><div class="sp"><div class="ttl">Trả dần mỗi ngày</div><div class="sub" id="hdSub"></div></div>
    <button class="sbtn" data-act="dot" aria-label="Trạng thái đồng bộ"><span class="sdot hidden" id="sdot"></span></button>
    <button class="gear" data-act="settings" aria-label="Cài đặt"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
</header>
<main class="wrap" id="app"></main>
<button class="fab hidden" id="fab" data-act="fab" aria-label="Thêm khoản">+</button>
<div class="scrim hidden" id="scrim"></div>
<div class="sheet hidden" id="sheet" role="dialog" aria-modal="true"></div>
<div id="toast" role="status"></div>
<input type="file" id="file" accept="application/json,.json" class="hidden">
<script>'use strict';
/* ===== scene.js — misty-hills header, drawn once as an <img> ===== */
const THEMES = {
  earth:  { sky: ['#EBC9A0', '#F7E9D4'], ridges: ['#E2B88E', '#CF946A', '#B0704C', '#7E4A33'], sun: '#C8452C', ac: '#B0532A', ac2: '#C99230' },
  forest: { sky: ['#C9DFCB', '#EFF4E7'], ridges: ['#AECBA8', '#84AC82', '#5C8C61', '#3B6948'], sun: '#FFFDF4', ac: '#3B7A4D', ac2: '#C6613A' },
  sea:    { sky: ['#B8DCE8', '#EDF6F4'], ridges: ['#A3CEDC', '#74B2C8', '#4690B0', '#256A8C'], sun: '#FFFFFF', ac: '#1D7898', ac2: '#E0784E' },
  wind:   { sky: ['#CFDBF0', '#F4F2F8'], ridges: ['#C3CEE6', '#A6B4D7', '#8894C2', '#6772A6'], sun: '#FFFFFF', ac: '#4569B3', ac2: '#D9A32E' }
};
const THEME_NAMES = { earth: 'Đất', forest: 'Rừng', sea: 'Biển', wind: 'Gió' };
const PHASES = {
  dawn:  { sky: ['#EDB9AC', '#FAE3CF'], tint: '#F2B3A0', k: 0.22 },
  dusk:  { sky: ['#D98A7E', '#F4C9A6'], tint: '#6A3E62', k: 0.42 },
  night: { sky: ['#16203D', '#34406A'], tint: '#111933', k: 0.66 }
};
function phaseOf(h) { return h >= 5 && h < 8 ? 'dawn' : h >= 8 && h < 16 ? 'day' : h >= 16 && h < 19 ? 'dusk' : 'night'; }
function rng(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function mix(a, b, k) {
  const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const x = p(a), y = p(b);
  return '#' + x.map((v, i) => Math.round(v + (y[i] - v) * k).toString(16).padStart(2, '0')).join('');
}
function ridge(yBase, amp, seed, freq, W = 800, H = 440) {
  const r = rng(seed), p = [r() * 6, r() * 6];
  let d = `M0 ${H} L`;
  for (let x = 0; x <= W; x += 5) {
    const y = yBase - amp * (0.7 * Math.sin(x * freq + p[0]) + 0.3 * Math.sin(x * freq * 2.1 + p[1]));
    d += `${x} ${y.toFixed(1)} L`;
  }
  return d + `${W} ${H}Z`;
}
function sceneURL(theme, phase) {
  const T = THEMES[theme] || THEMES.forest, P = PHASES[phase];
  const W = 800, H = 440, sky = P ? P.sky : T.sky;
  const rid = T.ridges.map(c => P ? mix(c, P.tint, P.k) : c);
  const R = [[246, 26, .0085], [286, 22, .011], [326, 18, .014], [366, 14, .018]];
  let s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMax slice">` +
    `<defs><linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sky[0]}"/><stop offset="1" stop-color="${sky[1]}"/></linearGradient>` +
    `<linearGradient id="m" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="${phase === 'night' ? .12 : .35}"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>` +
    `<rect width="${W}" height="${H}" fill="url(#s)"/>`;
  if (phase === 'night') {
    const r = rng(11);
    for (let i = 0; i < 38; i++) s += `<circle cx="${(r() * W).toFixed(0)}" cy="${(r() * 190).toFixed(0)}" r="${(r() * 1.3 + .4).toFixed(1)}" fill="#fff" opacity="${(r() * .5 + .35).toFixed(2)}"/>`;
    s += `<circle cx="600" cy="120" r="30" fill="#F4F0DC"/><circle cx="614" cy="110" r="27" fill="${sky[0]}"/>`;
  } else {
    const sun = phase === 'dawn' || phase === 'dusk' ? '#FFF3E0' : T.sun;
    s += `<circle cx="600" cy="${phase === 'day' ? 120 : 165}" r="34" fill="${sun}"/>`;
    const bird = phase === 'day' ? '#4B5560' : '#6A4A50';
    s += `<path d="M350 170q6-5 12 0q6-5 12 0M392 152q5-4 10 0q5-4 10 0M330 190q4-3 8 0q4-3 8 0" stroke="${bird}" fill="none" stroke-width="2" stroke-linecap="round" opacity=".7"/>`;
  }
  R.forEach((r, i) => {
    s += `<path d="${ridge(r[0], r[1], i * 7 + 3, r[2])}" fill="${rid[i]}"/>`;
    if (i < 3) s += `<rect y="${r[0] - 34}" width="${W}" height="46" fill="url(#m)"/>`;
  });
  return 'data:image/svg+xml,' + encodeURIComponent(s + '</svg>');
}

'use strict';
/* ===== Trả dần mỗi ngày — app ===== */
const APP_ID = 'tra-no';
const LS = { cache: 'trn.v1', auth: 'trn.auth', out: 'trn.out', dev: 'trn.dev', vis: 'trn.vis', diag: 'trn.diag' };
const WD = ['Chủ nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];

/* ---------- storage (never throws) ---------- */
let STORAGE_OK = true;
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { STORAGE_OK = false; return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { STORAGE_OK = false; return false; } }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } }
function lsJSON(k, d) { try { const v = JSON.parse(lsGet(k) || 'null'); return v == null ? d : v; } catch (e) { return d; } }

/* ---------- diagnostics ---------- */
function logDiag(msg) {
  const a = lsJSON(LS.diag, []); const list = Array.isArray(a) ? a : [];
  list.push(new Date().toISOString().slice(0, 19) + ' ' + String(msg).slice(0, 300));
  lsSet(LS.diag, JSON.stringify(list.slice(-40)));
}
window.addEventListener('error', e => logDiag('error: ' + (e.message || '') + ' @' + (e.lineno || '')));
window.addEventListener('unhandledrejection', e => logDiag('promise: ' + ((e.reason && e.reason.message) || e.reason)));

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => (n < 0 ? '-' : '') + String(Math.round(Math.abs(n))).replace(/\B(?=(\d{3})+(?!\d))/g, '.') + 'đ';
function short(n) {
  if (n >= 1e6) return (Math.round(n / 1e5) / 10).toString().replace('.', ',') + 'tr';
  if (n >= 1000) return Math.round(n / 1000) + 'k';
  return String(n);
}
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const PREVIEW = (() => { try { const q = new URLSearchParams(location.search).get('now'); const t = q ? Date.parse(q) : NaN; return isNaN(t) ? 0 : t - Date.now(); } catch (e) { return 0; } })();
const NOW = () => new Date(Date.now() + PREVIEW);
const keyOf = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const todayKey = () => keyOf(NOW());
const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
function addDays(k, n) { const d = parseKey(k); d.setDate(d.getDate() + n); return keyOf(d); }
const fmtDay = k => { const d = parseKey(k); return d.getDate() + '/' + (d.getMonth() + 1); };
function fmtDayLong(k) {
  const t = todayKey();
  if (k === t) return 'Hôm nay';
  if (k === addDays(t, -1)) return 'Hôm qua';
  const d = parseKey(k); return WD[d.getDay()] + ' ' + fmtDay(k) + (d.getFullYear() !== NOW().getFullYear() ? '/' + d.getFullYear() : '');
}
const hhmm = t => { const d = new Date(t); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
const newId = p => p + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const isDate = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && keyOf(parseKey(s)) === s;
/* "150" -> 150.000, "150k" -> 150.000, "1,5tr" -> 1.500.000, "150.000" -> 150.000 */
function parseAmount(s) {
  s = String(s || '').toLowerCase().replace(/\s+/g, '').replace(/đ|vnd/g, '');
  if (!s) return null;
  let mult = 1;
  if (/(tr|m|triệu)$/.test(s)) { mult = 1e6; s = s.replace(/(tr|m|triệu)$/, ''); }
  else if (/(k|nghìn|ngàn)$/.test(s)) { mult = 1e3; s = s.replace(/(k|nghìn|ngàn)$/, ''); }

  if (mult > 1) n = parseFloat(s.replace(',', '.')) * mult;

  n = Math.round(n);
  return Number.isFinite(n) && n >= 1000 && n <= 1e9 ? n : null;
}

/* ---------- state ---------- */
const DEF_SETTINGS = { target: 150000, payer: 'anh Trường', admin: 'Mẫn', start: '' };
let AUTH = null;        // {role:'admin'|'payer', pin?, key?, server}
let CACHE = { v: 0, settings: { ...DEF_SETTINGS }, entries: [] };

function cleanEntry(x) {
  if (!x || typeof x !== 'object' || typeof x.id !== 'string' || !/^[A-Za-z0-9-]{4,40}$/.test(x.id)) return null;
  if (!['repay', 'advance', 'miss'].includes(x.type) || !isDate(x.date)) return null;
  const amount = x.type === 'miss' ? 0 : Math.round(Number(x.amount));
  if (x.type !== 'miss' && !(amount >= 1000 && amount <= 1e9)) return null;
  const n = v => { const t = Number(v); return Number.isFinite(t) && t > 0 ? t : 0; };
  return {
    id: x.id, type: x.type, amount, date: x.date, note: String(x.note || '').slice(0, 200),
    status: ['pending', 'ok', 'rejected'].includes(x.status) ? x.status : 'ok', by: x.by === 'payer' ? 'payer' : 'admin',
    reason: String(x.reason || '').slice(0, 200), created: n(x.created), updated: n(x.updated)

}
function cleanSettings(o) {
  o = o && typeof o === 'object' ? o : {};
  const t = Math.round(Number(o.target));
  return {
    target: t >= 1000 && t <= 1e8 ? t : DEF_SETTINGS.target,
    payer: typeof o.payer === 'string' && o.payer.trim() ? o.payer.trim().slice(0, 30) : DEF_SETTINGS.payer,
    admin: typeof o.admin === 'string' && o.admin.trim() ? o.admin.trim().slice(0, 30) : DEF_SETTINGS.admin,
    start: isDate(o.start) ? o.start : ''

}
function cleanCache(o) {

}
function loadAll() {

}

/* ---------- local view = server copy + waiting changes ---------- */
function applyLocal(entries, settings, ops) {
  const list = entries.map(x => ({ ...x })), st = { ...settings }, now = Date.now();
  const role = AUTH ? AUTH.role : 'payer';
  for (const op of ops) {
    const i = list.findIndex(x => x.id === op.id);
    if (op.op === 'add' && i < 0) list.push({ id: op.id, type: op.type, amount: op.type === 'miss' ? 0 : op.amount, date: op.date, note: op.note || '', status: role === 'admin' || op.type === 'miss' ? 'ok' : 'pending', by: role, reason: '', created: op.t || now, updated: op.t || now, local: true });
    else if (op.op === 'edit' && i >= 0) { const x = list[i]; if (op.date) x.date = op.date; if (op.amount && x.type !== 'miss') x.amount = op.amount; if (op.note !== undefined) x.note = op.note; if (role === 'payer' && x.type !== 'miss') { x.status = 'pending'; x.reason = ''; } x.local = true; }
    else if (op.op === 'del' && i >= 0) list.splice(i, 1);
    else if (op.op === 'status' && i >= 0) { list[i].status = op.status; list[i].reason = op.status === 'rejected' ? (op.reason || '') : ''; list[i].local = true; }
    else if (op.op === 'settings') Object.assign(st, op.data);
  }
  list.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : a.created - b.created);
  return { entries: list, settings: cleanSettings(st) };
}
let VIEW = { entries: [], settings: { ...DEF_SETTINGS } };

/* ---------- stats ---------- */
const BADGES = [
  { k: 'first', t: '🌱 Lần đầu', ok: s => s.payDays >= 1 },
  { k: 's3', t: '🔥 Chuỗi 3', streak: 3 },
  { k: 's7', t: '🌿 Chuỗi 7', streak: 7 },
  { k: 's14', t: '🌳 Chuỗi 14', streak: 14 },
  { k: 's30', t: '⛰ Chuỗi 30', streak: 30 },
  { k: 'm1', t: '💯 1 triệu', amt: 1e6 },
  { k: 'm3', t: '✨ 3 triệu', amt: 3e6 },
  { k: 'm5', t: '🏮 5 triệu', amt: 5e6 },
  { k: 'half', t: '🌗 Nửa chặng', ok: s => s.advanced > 0 && s.repaid * 2 >= s.advanced },
  { k: 'done', t: '🏁 Về đích', ok: s => s.advanced > 0 && s.repaid >= s.advanced }
];
function stats() {
  const E = VIEW.entries, st = VIEW.settings, today = todayKey();
  const day = {}; let advanced = 0, repaid = 0, pending = 0, minDate = '';
  for (const x of E) {
    if (!minDate || x.date < minDate) minDate = x.date;
    if (x.status === 'rejected') continue;
    const d = day[x.date] || (day[x.date] = { ok: 0, pend: 0, miss: [], n: 0 });
    if (x.type === 'advance' && x.status === 'ok') advanced += x.amount;
    if (x.type === 'repay') {
      if (x.status === 'ok') { repaid += x.amount; d.ok += x.amount; } else { pending += x.amount; d.pend += x.amount; }
      d.n++;
    }
    if (x.type === 'miss') d.miss.push(x.note || '');
  }
  const start = st.start || minDate || today;
  const paid = k => !!(day[k] && day[k].ok + day[k].pend > 0);
  const todayPaid = paid(today);
  let cur = 0;
  for (let k = todayPaid ? today : addDays(today, -1); k >= start && paid(k); k = addDays(k, -1)) cur++;
  let best = 0, run = 0, missed = 0, payDays = 0, guard = 0;
  for (let k = start; k <= today && guard < 4000; k = addDays(k, 1), guard++) {
    if (paid(k)) { run++; payDays++; best = Math.max(best, run); } else { run = 0; if (k < today) missed++; }
  }
  const mStart = today.slice(0, 8) + '01', from = start > mStart ? start : mStart;
  let mPaid = 0, mDays = 0, mSum = 0;
  for (let k = from; k <= today && mDays < 40; k = addDays(k, 1)) { mDays++; if (paid(k)) mPaid++; mSum += day[k] ? day[k].ok + day[k].pend : 0; }
  const owed = advanced - repaid;
  const okDays = Object.values(day).filter(d => d.ok > 0).length;
  return {
    day, start, today, todayPaid, todayAmt: day[today] ? day[today].ok + day[today].pend : 0, todayPend: day[today] ? day[today].pend : 0,
    cur, best, missed, payDays, mPaid, mDays, mSum, advanced, repaid, pending, owed,
    avg: okDays ? Math.round(repaid / okDays) : 0,
    daysLeft: owed > 0 ? Math.ceil(owed / st.target) : 0,
    pct: advanced > 0 ? Math.min(100, repaid / advanced * 100) : 0
  };
}
const badgeOn = (b, s) => b.ok ? b.ok(s) : b.streak ? s.best >= b.streak : s.repaid >= b.amt;

}

function calendarHtml(s) {
  const today = s.today, curM = today.slice(0, 7), startM = s.start.slice(0, 7);
  if (!UI.cal || UI.cal > curM) UI.cal = curM;
  if (UI.cal < startM) UI.cal = startM;
  const [y, m] = UI.cal.split('-').map(Number);
  const first = new Date(y, m - 1, 1), nDays = new Date(y, m, 0).getDate(), lead = (first.getDay() + 6) % 7;
  let h = ['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN'].map(w => `<div class="w">${w}</div>`).join('');
  for (let i = 0; i < lead; i++) h += '<div></div>';
  const target = VIEW.settings.target;
  for (let d = 1; d <= nDays; d++) {
    const k = UI.cal + '-' + String(d).padStart(2, '0'), x = s.day[k];
    let c = 'd';
    if (k < s.start) c = 'pre';

    else if (x && x.pend > 0) c = 'pend';

}

function chartSvg(s) {
  const st = VIEW.settings, today = s.today;
  let keys = [];
  const from = UI.range === 0 ? s.start : addDays(today, -(UI.range - 1));
  for (let k = from, i = 0; k <= today && i < 4000; k = addDays(k, 1), i++) keys.push(k);
  let bins = keys.map(k => ({ k, ok: s.day[k] ? s.day[k].ok : 0, pend: s.day[k] ? s.day[k].pend : 0, lab: k }));
  let target = st.target, weekly = false;
  if (bins.length > 45) {                     // long ranges: one bar per week
    weekly = true; target = st.target * 7;
    const w = [];
    for (const b of bins) {
      const d = parseKey(b.k), mon = addDays(b.k, -((d.getDay() + 6) % 7));
      if (!w.length || w[w.length - 1].lab !== mon) w.push({ ok: 0, pend: 0, lab: mon });
      w[w.length - 1].ok += b.ok; w[w.length - 1].pend += b.pend;
    }
    bins = w;
  }
  const W = 340, H = 130, n = bins.length || 1, bw = W / n;
  const mx = Math.max(target * 1.5, ...bins.map(b => b.ok + b.pend)) || 1;
  const y = v => H - v / mx * H;
  let svg = `<svg viewBox="0 0 ${W} ${H + 20}" role="img" aria-label="Biểu đồ khoản trả">`;
  svg += `<line x1="0" x2="${W}" y1="${y(target).toFixed(1)}" y2="${y(target).toFixed(1)}" stroke="var(--ac2)" stroke-dasharray="4 4" stroke-width="1"/>`;
  bins.forEach((b, i) => {
    const x = i * bw + bw * .17, w = Math.max(1.5, bw * .66);
    if (b.ok) svg += `<rect x="${x.toFixed(1)}" y="${y(b.ok).toFixed(1)}" width="${w.toFixed(1)}" height="${(H - y(b.ok)).toFixed(1)}" rx="2" fill="var(--ac)"/>`;
    if (b.pend) { const top = b.ok + b.pend; svg += `<rect x="${x.toFixed(1)}" y="${y(top).toFixed(1)}" width="${w.toFixed(1)}" height="${(y(b.ok) - y(top)).toFixed(1)}" rx="2" fill="var(--acl)" opacity=".7"/>`; }
    if (!b.ok && !b.pend) svg += `<rect x="${x.toFixed(1)}" y="${H - 3}" width="${w.toFixed(1)}" height="3" rx="1" fill="#E3DDD1"/>`;
    const every = n <= 10 ? 1 : n <= 31 ? 5 : Math.ceil(n / 6);
    if ((n - 1 - i) % every === 0) svg += `<text x="${Math.min(W - 14, Math.max(14, x + w / 2)).toFixed(1)}" y="${H + 14}" text-anchor="middle" font-size="9" fill="#8A8F96">${fmtDay(b.lab)}</text>`;
  });
  svg += `<text x="2" y="${(y(target) - 4).toFixed(1)}" font-size="10" fill="var(--ac2)">${short(target)}${weekly ? '/tuần' : ''}</text>`;
  return svg + '</svg>';
}

let toastT = 0;

/* ---------- sheets + back gesture ---------- */
let SHEET = null, lastBack = 0, HIST = true;
/* Each open sheet owns one history entry, so the phone's Back gesture closes it.
   Closing from a button goes back one entry; a sheet opened while that is still
   in flight waits for it before adding its own entry. */
const NAV = { closing: false, queued: false, timer: 0 };
function hist(fn) { try { fn(); return true; } catch (e) { HIST = false; return false; } }
const histState = () => { try { return history.state; } catch (e) { return null; } };
function openSheet(html, bind) {
  const sh = $('#sheet');
  sh.innerHTML = `<div class="grab"></div>` + html;
  if (!SHEET) {
    SHEET = { pushed: false };
    if (NAV.closing) { NAV.queued = true; SHEET.pushed = true; }
    else SHEET.pushed = hist(() => history.pushState({ trn: 'sheet' }, ''));
    $('#scrim').classList.remove('hidden'); sh.classList.remove('hidden');
    requestAnimationFrame(() => { if (SHEET) { $('#scrim').classList.add('on'); sh.classList.add('on'); } });
  }
  sh.scrollTop = 0;
  if (bind) bind(sh);
}
function hideSheetDom() {
  if (!SHEET) return;
  SHEET = null;
  const sh = $('#sheet');
  if (document.activeElement && sh.contains(document.activeElement)) document.activeElement.blur();
  $('#scrim').classList.remove('on'); sh.classList.remove('on');
  setTimeout(() => { if (!SHEET) { $('#scrim').classList.add('hidden'); sh.classList.add('hidden'); sh.innerHTML = ''; } }, DEV.lite ? 0 : 230);
  if (pendingRender) { pendingRender = false; safeRender(); }
}
function navDone() {
  NAV.closing = false; clearTimeout(NAV.timer);
  if (NAV.queued) { NAV.queued = false; if (SHEET) SHEET.pushed = hist(() => history.pushState({ trn: 'sheet' }, '')); }
}
function closeSheet() {
  if (!SHEET) return;
  const pushed = SHEET.pushed && !NAV.queued, st = histState();
  if (NAV.queued) NAV.queued = false;
  hideSheetDom();
  if (pushed && st && st.trn === 'sheet' && !NAV.closing) {
    NAV.closing = true;
    if (!hist(() => history.back())) { navDone(); return; }
    NAV.timer = setTimeout(navDone, 700);
  }
}
function setupBackGuard() {
  hist(() => { history.replaceState({ trn: 'base' }, ''); history.pushState({ trn: 'guard' }, ''); });
  window.addEventListener('popstate', e => {
    const st = e.state;
    if (NAV.closing) { navDone(); return; }
    if (SHEET) { hideSheetDom(); if (st && st.trn === 'base') hist(() => history.pushState({ trn: 'guard' }, '')); return; }
    if (st && st.trn === 'guard') return;
    const now = Date.now();
    if (now - lastBack < 2500) { hist(() => history.back()); return; }
    lastBack = now;
    toast('Vuốt lại lần nữa để thoát');
    hist(() => history.pushState({ trn: 'guard' }, ''));
  });
}

const CHIPS = [50000, 100000, 150000, 200000, 300000];
/* Encouragement while the payer types. Ranges follow the daily target T:
   below T · exactly T · up to T+100k · up to T+350k · T+350k and more (150k target -> 150 / 250 / 500k). */
function cheerText(total) {
  const T = VIEW.settings.target;
  if (!(total > 0)) return '';
  if (total < T) return 'Hôm nay cố tới đây. Mai sẽ nhiều hơn 💪';
  if (total === T) return 'Đúng mục tiêu hôm nay ✓';
  if (total < T + 100000) return 'Tuyệt, tiếp tục cố gắng!';
  if (total < T + 350000) return 'Cứ đà này sẽ tốt lên!';
  return 'Quá đỉnh! Cảm ơn anh nhiều 🎉';
}

function bindAmount(sh) {
  const inp = sh.querySelector('[name=amt]'); if (!inp) return;
  const box = sh.querySelector('.cheer'), dateIn = sh.querySelector('[name=date]');
  const upd = () => {
    const v = parseAmount(inp.value);
    let hint = inp.value ? (v ? '= ' + money(v) : 'Số tiền chưa hợp lệ') : ' ', msg = '';
    if (v && sh.dataset.cheer) {
      const prev = dayRepayTotal(dateIn ? dateIn.value : todayKey(), sh.dataset.excl);

    if (box) { box.textContent = msg; box.classList.toggle('hidden', !msg); }
    sh.querySelectorAll('[data-chip]').forEach(b => b.classList.toggle('on', +b.dataset.chip === v));

const apiBase = () => ((AUTH && AUTH.server) || (/^https?:$/.test(location.protocol) ? location.origin : '')).replace(/\/+$/, '');
async function api(method, path, body, auth = AUTH) {

      ${PUSH.on ? '<div class="btns"><button class="btn g s" data-act="pushTest">Gửi thử</button></div>' : ''}`;
  return `<div class="sec"><div class="lbl">Thông báo</div>${body}
    ${admin ? `<p class="sm" style="margin-top:10px">Lời nhắc 18:00 gửi tới điện thoại của ${esc(VIEW.settings.payer)}: “Một ngày nỗ lực tuyệt vời, đừng quên ck cho ${esc(VIEW.settings.admin)} nha 💪”, hoặc lời cảm ơn nếu hôm nay đã gửi.</p>
      <div class="btns"><button class="btn g s" data-act="pushRemind">Gửi lời nhắc hôm nay ngay</button></div>` : ''}</div>`;
}

/* ---------- actions ---------- */
function sendPay(amount, date, note) {
  const total = dayRepayTotal(date) + amount;
  UI.draft = null;
  queue({ op: 'add', id: newId('p'), type: 'repay', amount, date, note });
  toast(isAdmin() ? 'Đã lưu' : `Đã gửi ${money(amount)} · ${cheerText(total)}`, 3500);
}
let eraseArm = 0;
const ACT = {
  close: () => closeSheet(),
  reload: () => location.reload(),
  settings: () => settingsSheet(),
  pay: () => paySheet(),
  payFor: b => paySheet(b.dataset.k),
  miss: () => missSheet(),
  missFor: b => missSheet(b.dataset.k),
  addFor: b => { addSheet('repay'); const d = $('#sheet [name=date]'); if (d) d.value = b.dataset.k; },
  fab: () => addSheet('repay'),
  day: b => daySheet(b.dataset.k),
  calPrev: () => { const [y, m] = UI.cal.split('-').map(Number); UI.cal = keyOf(new Date(y, m - 2, 1)).slice(0, 7); safeRender(); },
  calNext: () => { const [y, m] = UI.cal.split('-').map(Number); UI.cal = keyOf(new Date(y, m, 1)).slice(0, 7); safeRender(); },
  range: b => { UI.range = Number(b.dataset.v); safeRender(); },
  filter: b => { UI.filter = b.dataset.v; UI.more = 30; safeRender(); },
  more: () => { if (isAdmin()) UI.more += 50; else UI.pmore += 20; safeRender(); },
  edit: b => editSheet(b.dataset.id),
  ok: b => { queue({ op: 'status', id: b.dataset.id, status: 'ok' }); toast('Đã xác nhận ✓'); },
  okAll: () => { const P = VIEW.entries.filter(x => x.type === 'repay' && x.status === 'pending'); P.forEach(x => OUT.push({ op: 'status', id: x.id, status: 'ok', t: Date.now() })); saveOut(); safeRender(); schedSync(300); toast(`Đã xác nhận ${P.length} khoản`); },
  reject: b => rejectSheet(b.dataset.id),
  rejectSave: b => { const n = $('#sheet [name=note]'); queue({ op: 'status', id: b.dataset.id, status: 'rejected', reason: n ? n.value.trim().slice(0, 200) : '' }); closeSheet(); toast('Đã từ chối'); },
  paySave: () => {
    const f = readForm($('#sheet'), true); if (!f) return;
    closeSheet(); sendPay(f.amount, f.date, f.note);
  },
  quickPay: () => {
    const q = $('#quick'), err = q.querySelector('.err'), amount = parseAmount(q.querySelector('[name=amt]').value);
    if (!amount) { err.textContent = 'Nhập số tiền (ít nhất 1.000đ).'; return; }
    if (document.activeElement) document.activeElement.blur();
    sendPay(amount, todayKey(), '');
  },
  payMore: () => { const q = $('#quick'); paySheet(todayKey(), q ? parseAmount(q.querySelector('[name=amt]').value) : 0); },
  missSave: () => {
    const f = readForm($('#sheet'), false); if (!f) return;
    queue({ op: 'add', id: newId('m'), type: 'miss', amount: 0, date: f.date, note: f.note });
    closeSheet(); toast('Đã ghi lại. Ngày mai cố lên nhé!');
  },
  addSave: b => {
    const t = b.dataset.t, f = readForm($('#sheet'), t !== 'miss'); if (!f) return;
    queue({ op: 'add', id: newId(t[0]), type: t, amount: f.amount, date: f.date, note: f.note });
    closeSheet(); toast('Đã lưu');
  },
  editSave: b => {
    const x = VIEW.entries.find(e => e.id === b.dataset.id); if (!x) return closeSheet();
    const f = readForm($('#sheet'), x.type !== 'miss'); if (!f) return;
    const op = { op: 'edit', id: x.id, date: f.date, note: f.note };
    if (x.type !== 'miss') op.amount = f.amount;
    queue(op);
    const s = $('#sheet #stSel .on');
    if (isAdmin() && s && s.dataset.s !== x.status) queue({ op: 'status', id: x.id, status: s.dataset.s, reason: x.reason });
    closeSheet(); toast('Đã lưu');
  },
  delEntry: b => {
    if (b.dataset.arm !== '1') { b.dataset.arm = '1'; b.textContent = 'Chạm lần nữa để xoá'; setTimeout(() => { if (b.isConnected) { b.dataset.arm = ''; b.textContent = 'Xoá'; } }, 3000); return; }
    queue({ op: 'del', id: b.dataset.id }); closeSheet(); toast('Đã xoá');
  },
  syncNow: () => { SY.st = SY.st === 'locked' ? SY.st : 'idle'; syncNow(true); toast('Đang đồng bộ…', 1200); },
  shareLink: async () => {
    try {
      const r = await api('GET', 'admin/key');
      const url = apiBase() + '/tra-no.html#k=' + r.key;
      const text = `Link ghi khoản trả hằng ngày (mở bằng Chrome, lưu lại để dùng): ${url}`;
      if (navigator.share) { try { await navigator.share({ title: 'Trả dần mỗi ngày', text, url }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
      showLink(url);
    } catch (e) { toast(errText(e), 3500); }
  },
  newLink: async b => {
    if (b.dataset.arm !== '1') { b.dataset.arm = '1'; b.textContent = 'Chạm lần nữa: link cũ sẽ ngừng hoạt động'; return; }
    try { const r = await api('POST', 'admin/key'); showLink(apiBase() + '/tra-no.html#k=' + r.key, true); } catch (e) { toast(errText(e), 3500); }
  },
  saveSettings: () => {
    const sh = $('#sheet'), err = sh.querySelector('#sErr');
    const t = parseAmount(sh.querySelector('[name=sTarget]').value);
    if (!t) { err.textContent = 'Mục tiêu chưa hợp lệ.'; return; }
    const start = sh.querySelector('[name=sStart]').value;
    if (start && !isDate(start)) { err.textContent = 'Ngày bắt đầu chưa hợp lệ.'; return; }
    queue({ op: 'settings', data: { target: t, payer: sh.querySelector('[name=sPayer]').value.trim(), admin: sh.querySelector('[name=sAdmin]').value.trim(), start } });
    closeSheet(); toast('Đã lưu thiết lập');
  },
  lite: b => { DEV.lite = !DEV.lite; saveDev(); document.body.classList.toggle('lite', DEV.lite); b.classList.toggle('on', DEV.lite); },
  export: () => doExport(),
  share: () => doShare(),
  csv: () => doCsv(),
  import: () => { if (navigator.onLine === false) return toast('Cần có mạng để nhập dữ liệu.'); importPick(); },
  impDo: b => importDo(b.dataset.m),
  copyText: () => { const t = $('#sheet textarea'); t.select(); try { navigator.clipboard.writeText(t.value).then(() => toast('Đã sao chép'), () => document.execCommand('copy')); } catch (e) { document.execCommand('copy'); toast('Đã sao chép'); } },
  diag: () => {
    const d = lsJSON(LS.diag, []);
    const rep = [`Trả dần mỗi ngày v1 · ${new Date().toISOString()}`, `vai trò: ${AUTH ? AUTH.role : '-'} · đồng bộ: ${syncLine()} · chờ gửi: ${OUT.length}`, `số khoản: ${VIEW.entries.length} · ${navigator.userAgent}`, ...(Array.isArray(d) ? d : [])].join('\n');
    openSheet(`<h3>Chẩn đoán</h3><pre class="diag">${esc(rep)}</pre><div class="btns"><button class="btn s" data-act="copyDiag">Sao chép báo cáo</button><button class="btn g s" data-act="clearDiag">Xoá nhật ký</button></div>`);
  },
  copyDiag: () => { const t = $('#sheet pre').textContent; try { navigator.clipboard.writeText(t).then(() => toast('Đã sao chép')); } catch (e) { toast('Không sao chép được'); } },
  clearDiag: () => { lsDel(LS.diag); closeSheet(); toast('Đã xoá nhật ký'); },
  logout: b => {
    if (b.dataset.arm !== '1') { b.dataset.arm = '1'; b.textContent = OUT.length ? `Còn ${OUT.length} thay đổi chưa gửi! Chạm lần nữa` : 'Chạm lần nữa để đăng xuất'; return; }
    pushForget();
    AUTH = null; saveAuth(); CACHE = cleanCache({}); saveCache(); OUT = []; saveOut(); SY.st = 'idle';
    closeSheet(); safeRender();
  },
  erase: async b => {
    if (b.dataset.arm !== '1' || Date.now() - eraseArm > 5000) { b.dataset.arm = '1'; eraseArm = Date.now(); b.textContent = 'Chạm lần nữa: xoá trên MỌI máy'; return; }
    try { const r = await api('POST', 'admin/erase'); OUT = []; saveOut(); takeSnap(r); closeSheet(); safeRender(); toast('Đã xoá toàn bộ'); } catch (e) { toast(errText(e), 3500); }
  },
  login: () => login(($('#wPin') || {}).value || '', (($('#wSrv') || {}).value || '').trim()),
  relogin: () => pinSheet(),
  reloginDo: () => login(($('#rPin') || {}).value || '', AUTH && AUTH.server || ''),
  becomePayer: b => { pushForget(); AUTH = { role: 'payer', key: b.dataset.k, server: AUTH && AUTH.server || '' }; saveAuth(); CACHE = cleanCache({}); saveCache(); OUT = []; saveOut(); SY.st = 'idle'; closeSheet(); safeRender(); syncNow(true); },
  dot: () => toast(syncLine(), 2600),
  pushOn: b => pushEnable(b),
  pushOff: () => pushDisable(),
  pushLater: () => { DEV.pushHide = true; saveDev(); safeRender(); toast('Có thể bật sau trong ⚙ Cài đặt'); },
  pushTest: async () => {
    try { const s = await pushSub(); if (!s) return toast('Máy này chưa bật thông báo'); const r = await api('POST', 'push/test', { endpoint: s.endpoint }); toast(r.result === 'ok' ? 'Đã gửi thử, kiểm tra thanh thông báo' : 'Gửi thử lỗi: ' + r.result, 3500); }
    catch (e) { toast(errText(e), 3500); }
  },
  pushRemind: async () => {
    try {
      const r = await api('POST', 'push/remind', {});
      const n = r.sent ? r.sent.filter(x => x === 'ok').length : 0;
      toast(r.skipped ? 'Hôm nay anh ấy đã ghi lý do chưa trả được, không nhắc.' : n ? `Đã gửi tới ${n} máy: “${r.msg.body}”` : `${cap(VIEW.settings.payer)} chưa bật nhắc nhở trên điện thoại.`, 4000);
    } catch (e) { toast(errText(e), 3500); }
  }
};
function showLink(url, isNew) {
  openSheet(`<h3>${isNew ? 'Link mới' : 'Link cho người trả'}</h3><p class="sm">${isNew ? 'Link cũ đã ngừng hoạt động. ' : ''}Sao chép và gửi qua Zalo.</p>
    <textarea class="in" style="min-height:80px;font:13px var(--mono);margin-top:10px" readonly>${esc(url)}</textarea>
    <div class="btns"><button class="btn" data-act="copyText">Sao chép</button></div>`);
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const f = ACT[b.dataset.act]; if (!f) return;
  e.preventDefault();
  try { const r = f(b); if (r && r.catch) r.catch(err => logDiag('act ' + b.dataset.act + ': ' + (err && err.message))); }
  catch (err) { logDiag('act ' + b.dataset.act + ': ' + (err && err.stack || err)); toast('Có lỗi xảy ra'); }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !e.target.matches('input')) return;
  if (e.target.id === 'wPin' || e.target.id === 'wSrv') ACT.login();
  else if (e.target.id === 'rPin') ACT.reloginDo();
  else if (e.target.closest('#quick')) { e.preventDefault(); ACT.quickPay(); }
});
$('#scrim').addEventListener('click', () => closeSheet());

/* ---------- lifecycle ---------- */
function visMark(v) { lsSet(LS.vis, JSON.stringify({ vis: v, t: Date.now() })); }
function startup() {
  loadAll();
  const vis = lsJSON(LS.vis, {});
  if (vis && vis.vis === 1 && Date.now() - vis.t < 10 * 60e3 && !DEV.lite) {
    DEV.lite = true; saveDev(); logDiag('lite mode turned on after an unexpected close');
    setTimeout(() => toast('Đã bật chế độ nhẹ vì lần trước trang bị đóng đột ngột', 3500), 600);
  }
  document.body.classList.toggle('lite', DEV.lite);
  pickTheme();
  takeLinkKey();
  pushQuick();
  setupBackGuard();
  safeRender();
  visMark(1);
  if (AUTH) syncNow(true);
  setInterval(() => {
    if (document.hidden) return;
    visMark(1);
    syncNow();
    const a = document.activeElement;
    if (!(a && /INPUT|TEXTAREA|SELECT/.test(a.tagName))) requestRender(); else drawHeader();
  }, 30000);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { visMark(0); flushOnHide(); }
    else { visMark(1); UI.sceneKey === UI.theme + phaseOf(NOW().getHours()) || drawHeader(); syncNow(); pushRefresh(false); }
  });
  window.addEventListener('pagehide', () => { visMark(0); flushOnHide(); });
  window.addEventListener('hashchange', () => { if (/[#&]k=/.test(location.hash)) { takeLinkKey(); safeRender(); syncNow(true); } });
  window.addEventListener('online', () => syncNow(true));
  window.addEventListener('offline', () => setSync('offline'));
  if ('serviceWorker' in navigator && window.isSecureContext && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(e => logDiag('sw: ' + e.message));
  pushRefresh(true);
}
startup();
</script>
